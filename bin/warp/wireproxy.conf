# Cloudflare WARP userspace tunnel -> local SOCKS5 proxy (127.0.0.1:40000).
# wireproxy (wireguard-go, userspace) needs NO root on Render native runtime.
# WARP egress = consumer-grade Cloudflare IPs: YouTube does not bot-challenge
# them like datacenter/free-proxy IPs. This is the app's PRIMARY exit route.
[Interface]
PrivateKey = OHd+eRqiGHVhEfjEz72CaAV219Ry3No2Y8EWfpmM7Hg=
Address = 172.16.0.2/32
DNS = 1.1.1.1
MTU = 1280

[Peer]
PublicKey = bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo=
AllowedIPs = 0.0.0.0/0
Endpoint = engage.cloudflareclient.com:2408
PersistentKeepalive = 25

[Socks5]
BindAddress = 127.0.0.1:40000
